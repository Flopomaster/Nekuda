name: Bank sync

# Every night: pull new transactions for every connected bank / credit card account.
# Needs one repository secret, NEKUDA_SYNC_SECRET, created from the app (Settings → Bank sync).
on:
  schedule:
    - cron: '17 1 * * *' # 01:17 UTC ≈ 04:17 in Israel
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bank-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sync/package-lock.json
      - run: npm ci
      - name: Sync
        run: npm run sync
        env:
          NEKUDA_SYNC_SECRET: ${{ secrets.NEKUDA_SYNC_SECRET }}
